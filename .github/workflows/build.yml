name: Build and Push

on:
  push:
    branches: [main]
    paths: ["bot/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./bot
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/discord-bot:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/discord-bot:latest
